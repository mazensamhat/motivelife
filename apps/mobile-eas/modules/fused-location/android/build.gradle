plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules'
version = '1.0.0'

android {
  namespace "expo.modules.fusedlocation"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-location:21.3.0"
}
