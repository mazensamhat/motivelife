<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MotiveLife ASC Helper Options</title>
    <style>
      body {
        font: 14px/1.45 system-ui, sans-serif;
        max-width: 520px;
        margin: 32px auto;
        padding: 0 16px;
        color: #0f172a;
      }
      label {
        display: block;
        font-weight: 600;
        margin-top: 16px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }
      .row {
        margin-top: 16px;
      }
      button {
        margin-top: 20px;
        background: #0369a1;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        color: #15803d;
      }
      code {
        background: #f1f5f9;
        padding: 1px 4px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>MotiveLife ASC Helper</h1>
    <p>
      Reports (with screenshots) go to your MotiveLife API. Cursor reads them from
      <code>GET /api/asc-helper/latest</code>.
    </p>
    <label>
      API base URL
      <input id="apiBase" type="text" placeholder="https://www.mymotivelife.com" />
    </label>
    <label>
      Shared secret (must match Vercel <code>ASC_HELPER_SECRET</code>)
      <input id="secret" type="password" autocomplete="off" />
    </label>
    <div class="row">
      <label>
        <input id="autoReport" type="checkbox" checked />
        Auto-report when stuck
      </label>
    </div>
    <div class="row">
      <label>
        <input id="liveReport" type="checkbox" checked />
        Live report to Cursor (every ~10s + on each change)
      </label>
    </div>
    <button id="save" type="button">Save</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
